<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Weight criteria with CRITIC and rank alternatives with TOPSIS, with every intermediate step shown and checked against published examples. Runs in your browser, in English and Turkish." />
    <title>MCDM Workbench: multi-criteria decision analysis in the browser</title>
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#f5f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1012" media="(prefers-color-scheme: dark)" />
    <!-- Sharing preview. The pages update title and description per route and language at runtime;
         crawlers that do not run scripts see these English defaults. public/og.png is a real
         screenshot of the landing hero at 1200 x 630 (light, English). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MCDM Workbench" />
    <meta property="og:title" content="MCDM Workbench: multi-criteria decision analysis in the browser" />
    <meta property="og:description" content="Weight criteria with CRITIC and rank alternatives with TOPSIS, with every intermediate step shown and checked against published examples. Runs in your browser, in English and Turkish." />
    <meta property="og:url" content="https://fatihaydost.github.io/MCDM-Workbench/" />
    <meta property="og:image" content="https://fatihaydost.github.io/MCDM-Workbench/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The MCDM Workbench landing page: a TOPSIS ranking of five smartphones with CRITIC weights, computed live." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="tr_TR" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Before first paint: saved theme and language, so there is no flash of the wrong theme.
      // Keys match src/state/theme.ts and src/i18n/lang.ts.
      ;(function () {
        var d = document.documentElement
        try {
          var t = localStorage.getItem('kds.theme')
          if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t)
          var l = localStorage.getItem('kds.lang')
          if (l !== 'en' && l !== 'tr') l = (navigator.language || '').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en'
          d.lang = l
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
